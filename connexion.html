<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Connectez-vous à votre compte DualShop.">
  <title>Connexion — DualShop</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo/dualshop-mark.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="data/products.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/favorites.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html"><img class="logo-mark" src="assets/logo/dualshop-mark.svg" alt=""><span class="logo-wordmark">Dual<span>Shop</span></span></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" aria-label="Ouvrir le menu">
      <span></span><span></span><span></span>
    </button>
    <nav id="primary-navigation" aria-label="Navigation principale">
      <a href="index.html">Accueil</a>
      <a href="produits.html">Produits</a>
      <a href="favoris.html">Favoris <span class="favorite-count">0</span></a>
      <a href="connexion.html" aria-current="page">Connexion</a>
      <a href="panier.html">Panier <span class="cart-count">0</span></a>
    </nav>
  </header>
  <main class="section auth-section">
    <form id="login-form" class="auth-card">
      <p class="eyebrow">Bon retour</p>
      <h1>Connexion</h1>
      <label for="email">Adresse e-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="button" type="submit">Se connecter</button>
      <p id="login-message" class="form-message" aria-live="polite"></p>
      <p class="muted">Démo : cette page simule une connexion dans votre navigateur.</p>
    </form>
  </main>
  <footer class="site-footer">
    <a class="logo" href="index.html"><img class="logo-mark" src="assets/logo/dualshop-mark.svg" alt=""><span class="logo-wordmark">Dual<span>Shop</span></span></a>
    <p>© <span data-year></span> DualShop. Tous droits réservés.</p>
    <nav aria-label="Navigation de pied de page"><a href="produits.html">La boutique</a><a href="favoris.html">Favoris</a><a href="connexion.html">Mon compte</a><a href="panier.html">Mon panier</a></nav>
  </footer>
</body>
</html>
